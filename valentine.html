<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Valentine 💖</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: pink;
            font-family: "Comic Sans MS", cursive;
            overflow: hidden;
        }
        
        .bg {
            position: fixed;
            inset: 0;
            background: url("roses.png") repeat;
            background-size: 150px;
            opacity: 0.25;
        }
        
        .container {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 25px;
            text-align: center;
            max-width: 340px;
            box-shadow: 0 0 25px rgba(255, 0, 120, 0.4);
        }
        
        .photo-nous {
            width: 200px;
            border-radius: 20px;
            border: 4px solid pink;
            margin-bottom: 15px;
        }
        
        h1 {
            color: #e60073;
        }
        
        .buttons {
            position: relative;
            height: 120px;
            margin-top: 20px;
        }
        
        button {
            position: absolute;
            padding: 10px 22px;
            font-size: 16px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
        }
        
        #yes {
            background: #ff4d88;
            color: white;
            left: 40px;
        }
        
        #no {
            background: #bbb;
            left: 180px;
        }
        
        .ps {
            margin-top: 15px;
            font-size: 12px;
            color: #555;
            font-style: italic;
        }
        
        .ours-big {
            width: 220px;
            margin-bottom: 20px;
        }
        
        .heart {
            position: fixed;
            font-size: 24px;
            animation: float 4s linear infinite;
        }
        
        @keyframes float {
            from {
                transform: translateY(100vh);
                opacity: 1;
            }
            to {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="bg"></div>

    <div class="container">
        <div class="card">
            <img src="nous.jpeg" class="photo-nous" alt="Nous deux">
            <h1>Veux-tu être ma Valentine ? 💘</h1>

            <div class="buttons">
                <button id="yes">Oui 💖</button>
                <button id="no">Non 🙃</button>
            </div>

            <div class="ps">
                PS : ça ne sert à rien de vouloir cliquer sur non 😌
            </div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById("no");

        let posX = 180;
        let posY = 20;

        noBtn.style.left = posX + "px";
        noBtn.style.top = posY + "px";

        function moveAway(x, y) {
            const rect = noBtn.getBoundingClientRect();
            const dx = rect.left + rect.width / 2 - x;
            const dy = rect.top + rect.height / 2 - y;

            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 100) {
                posX += dx * 0.3;
                posY += dy * 0.3;

                const maxX = window.innerWidth - rect.width;
                const maxY = window.innerHeight - rect.height;

                posX = Math.max(0, Math.min(maxX, posX));
                posY = Math.max(0, Math.min(maxY, posY));

                noBtn.style.left = posX + "px";
                noBtn.style.top = posY + "px";
            }
        }

        document.addEventListener("mousemove", e => {
            moveAway(e.clientX, e.clientY);
        });

        document.addEventListener("touchmove", e => {
            const t = e.touches[0];
            moveAway(t.clientX, t.clientY);
        }, {
            passive: true
        });

        document.getElementById("yes").addEventListener("click", () => {
            document.body.innerHTML = `
        <div style="
            height:100vh;
            background:pink;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            font-family:Comic Sans MS;
        ">
            <img src="bear.png" style="width:220px;margin-bottom:20px;">
            <h1 style="color:#e60073;">C’est officiel 💖</h1>
            <h2>Océane, mon lapin 🐰❤️

Je t’aime plus que tout et je suis tellement heureux de t’avoir à mes côtés.
Merci d’être toi 💞</h2>
        </div>
    `;

            for (let i = 0; i < 40; i++) {
                const heart = document.createElement("div");
                heart.innerText = "💖";
                heart.style.position = "fixed";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.bottom = "-20px";
                heart.style.fontSize = "24px";
                heart.style.animation = "float " + (2 + Math.random() * 3) + "s linear infinite";
                document.body.appendChild(heart);
            }
        });
    </script>

</body>

</html>
